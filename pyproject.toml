[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "basalt-finance"
version = "0.1.0"
description = "Governed intelligent financial infrastructure for agents and regulated operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "mcp>=1.2,<2.0",
]

[project.optional-dependencies]
a2a = ["a2a-sdk>=1.0,<2.0"]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
]

[project.scripts]
basalt-finance = "basalt_finance.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["vaulteq.*", "zeroclose.*"]
ignore_missing_imports = true
